plugins { id 'com.android.application' }

android {
    namespace 'com.carma2.recomp'
    compileSdk 34
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.carma2.recomp'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static', "-DC2_WITH_GAME=${project.findProperty('withGame') ?: 'OFF'}" } }
    }
    buildTypes {
        release {
            minifyEnabled false     // unsigned: the APK builder adds the game and signs it with your own key
        }
    }
    externalNativeBuild { cmake { path 'jni/CMakeLists.txt'; version '3.22.1' } }
    sourceSets { main { assets.srcDirs = ['src/main/assets'] } }
    androidResources { noCompress 'ogg' }
}
